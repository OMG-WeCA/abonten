server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /_container/health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
