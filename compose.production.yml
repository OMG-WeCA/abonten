# Application containers only. PostgreSQL/PostGIS, Redis, S3-compatible object
# storage, SMTP, and TLS ingress are provisioned separately on ccp-prod.
services:
  api:
    image: abonten-api:${ABONTEN_IMAGE_TAG:-local}
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL}
      WEB_BASE_URL: ${WEB_BASE_URL:?Set WEB_BASE_URL}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      EMAIL_CODE_SECRET: ${EMAIL_CODE_SECRET:?Set EMAIL_CODE_SECRET}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      ENRICHMENT_DATA_DIR: /app/var/enrichment
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_REDIRECT_URL: ${AZURE_AD_REDIRECT_URL:-}
    volumes:
      - abonten_enrichment:/app/var/enrichment
    ports:
      - '${ABONTEN_BIND_ADDRESS:-127.0.0.1}:${ABONTEN_API_BIND_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: abonten-web:${ABONTEN_IMAGE_TAG:-local}
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:?Set NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
    restart: unless-stopped
    ports:
      - '${ABONTEN_BIND_ADDRESS:-127.0.0.1}:${ABONTEN_WEB_BIND_PORT:-3001}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/_container/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  abonten_enrichment:
